; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src/
default_envs = esp32s3
boards_dir = boards
globallib_dir = lib

[env]
; platform = espressif32
; pinned to pioarduino 55.3.312 (arduino-esp32 3.3.12), requires PlatformIO Core >= 6.2.0
platform = https://github.com/pioarduino/platform-espressif32.git#2959e98a2750832bca32fd2f849c0c274a4cdd63
framework = arduino
lib_compat_mode = strict
build_flags = 
	-D MASK_VERSION=0x57B0	
;	-D KNX_FLASH_SIZE=0x4000
;	-D EEPROM_EMULATION_SIZE=8192
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-Wno-unknown-pragmas
	-w
lib_deps = 
	ayushsharma82/ElegantOTA @ 3.1.7
	esp32async/ESPAsyncWebServer @ 3.12.1	; dependency of ElegantOTA, pinned
	esp32async/AsyncTCP @ 3.5.0			; dependency of ESPAsyncWebServer, pinned
	tzapu/WiFiManager @ 2.0.17
;	https://github.com/mwerski/knx.git#1.4
	https://github.com/OpenKNX/knx.git#8e4c5bc5c55bc7bc07711992d7794478f3e40797
	adafruit/Adafruit NeoPixel @ 1.15.1
	4-20ma/ModbusMaster @ 2.0.1
	knolleary/PubSubClient @ 2.8
	bblanchon/ArduinoJson @ 7.4.3
	karol-brejna-i/RemoteDebug @ 4.0.1
;	https://github.com/mwerski/RemoteDebug
	https://github.com/YiannisBourkelis/Uptime-Library.git#fa29a94f5664b70175eadd79f8aaf1464a966dc5
	paulstoffregen/Time @ 1.6.1
	arkhipenko/TaskScheduler @ 3.8.5
	paulstoffregen/OneWire @ 2.3.8
	milesburton/DallasTemperature @ 4.0.6
	plerup/EspSoftwareSerial @ 8.1.0
;	robtillaart/Temperature @ 0.4.0
	https://github.com/RobTillaart/Temperature.git#0.4.0
;	drmpf/NonBlockingModbusMaster @ 1.0.1
	https://github.com/mwerski/NonBlockingModbusMaster.git#bd8d8c8a7309438066e2108ebc1b7714c404221a
	powerbroker2/SafeString @ 4.1.45

[env:esp32c3]
extends = env
board = esp32-c3-devkitm-1

[env:esp32s3]
extends = env
;board = esp32s3_psram
board = esp32-s3-devkitm-1
upload_protocol = espota
upload_port = 192.168.1.194
