; ---------------------------------------------------------------------------
; Projektspezifische Einstellungen
; ---------------------------------------------------------------------------
[custom]
build_flags =
  -D OPENKNX_LOOPTIME_WARNING=100
  ; Webserver von OFM-Network (Uebersicht, Prog-Modus) und Web-Konsole
  -D OPENKNX_WEBSERVER
  -D OPENKNX_WEBCONSOLE
  ; MQTT-Client von OFM-Network (Broker und Praefix ueber ETS-Parameter)
  -D OPENKNX_MQTT
  ; Sonnenstand (Hoehe/Azimut) fuer das Wettersymbol sonnig/bewoelkt
  -D OPENKNX_SUN_POSITION
  ; MQTT-Sendepuffer fuer das JSON mit allen Messwerten
  -D OPENKNX_MQTT_TXBUF_MAX=4096
lib_deps =
  https://github.com/mwerski/NonBlockingModbusMaster.git#bd8d8c8a7309438066e2108ebc1b7714c404221a
  paulstoffregen/OneWire @ 2.3.8
  milesburton/DallasTemperature @ 4.0.6
  https://github.com/RobTillaart/Temperature.git#0.4.0
  bblanchon/ArduinoJson @ 7.4.3

[ESP32_custom]
; LilyGO T-RSS3: ESP32-S3 mit 8 MB Flash, OpenKNX-Partitionstabelle mit zwei OTA-Slots
extends = ESP32_8MB
board = esp32-s3-devkitm-1
build_flags =
  -D SERIAL_DEBUG=Serial
  -D DEVICE_WN90_TRSS3
  -D KNX_IP_WIFI
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

; Entwicklungs-Build mit Debug-Ausgaben (USB)
[env:develop_WN90]
extends = ESP32_develop, ESP32_custom
board = ${ESP32_custom.board}
board_build.partitions = ${ESP32_custom.board_build.partitions}
board_upload.flash_size = ${ESP32_custom.board_upload.flash_size}
board_upload.maximum_size = ${ESP32_custom.board_upload.maximum_size}
build_flags =
  ${KNX_IP.build_flags}
  ${ESP32_develop.build_flags}
  ${ESP32_custom.build_flags}
  ${custom.build_flags}
  -D OPENKNX_HEARTBEAT
lib_deps =
  ${env.lib_deps}
  ${custom.lib_deps}

; Release-Build mit Watchdog (USB)
[env:release_WN90]
extends = ESP32_releases, ESP32_custom
board = ${ESP32_custom.board}
board_build.partitions = ${ESP32_custom.board_build.partitions}
board_upload.flash_size = ${ESP32_custom.board_upload.flash_size}
board_upload.maximum_size = ${ESP32_custom.board_upload.maximum_size}
build_flags =
  ${KNX_IP.build_flags}
  ${ESP32_releases.build_flags}
  ${ESP32_custom.build_flags}
  ${custom.build_flags}
lib_deps =
  ${env.lib_deps}
  ${custom.lib_deps}

; OTA-Update ueber WLAN (ArduinoOTA, Port 3232) mit der Release-Firmware.
; IP-Adresse des Geraets eintragen; je nach ETS-Einstellung muss das Geraet im Prog-Modus sein.
[env:ota_WN90]
extends = env:release_WN90
upload_protocol = espota
upload_port = 192.168.3.20
upload_flags =
  --port=3232

; OTA-Update mit der Entwicklungs-Firmware (ausfuehrliche Logs)
[env:ota_develop_WN90]
extends = env:develop_WN90
upload_protocol = espota
upload_port = ${env:ota_WN90.upload_port}
upload_flags = ${env:ota_WN90.upload_flags}
